# Sobe tudo com:   docker compose up -d --build
# HTTPS: o serviço "caddy" atende as portas 80/443 com certificado automático para SITE_DOMAINS (.env).
# Dados de demonstração (opcional):   docker compose run --rm -e SEED_DEMO=1 migrate npm run db:seed
name: pvne-cards

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pvne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pvne}
      POSTGRES_DB: ${POSTGRES_DB:-pvne}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pvne}"]
      interval: 5s
      retries: 20

  # Aplica as migrações (e o seed básico: categorias, páginas, admin) e termina.
  migrate:
    image: pvne-cards-app
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pvne}:${POSTGRES_PASSWORD:-pvne}@db:5432/${POSTGRES_DB:-pvne}?schema=public
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: pvne-cards-app
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pvne}:${POSTGRES_PASSWORD:-pvne}@db:5432/${POSTGRES_DB:-pvne}?schema=public
      UPLOAD_DIR: /app/storage/uploads
      PRIVATE_UPLOAD_DIR: /app/storage/private
    # Só acessível pela própria VPS; o público entra pelo Caddy (HTTPS)
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/storage/uploads
      - private:/app/storage/private
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Encerra leilões no horário, ativa agendados e envia avisos de "acabando".
  worker:
    image: pvne-cards-app
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pvne}:${POSTGRES_PASSWORD:-pvne}@db:5432/${POSTGRES_DB:-pvne}?schema=public
    command: npm run worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  # HTTPS automático (Let's Encrypt) na frente do app
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAINS: ${SITE_DOMAINS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  uploads:
  private:
