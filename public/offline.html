<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060A26">
<title>Sem conexão · PVNE Cards</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: #060A26 radial-gradient(900px 500px at 50% 30%, rgba(2, 62, 230, .28), transparent 65%);
    color: #F3F6FF; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  img { width: 180px; height: auto; }
  h1 { margin: 28px 0 8px; font-size: 22px; }
  p { margin: 0 auto; max-width: 320px; color: #A9B8DB; }
  button {
    margin-top: 28px; height: 48px; padding: 0 28px; border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #FFE650, #FBDB02 45%, #F7AC05); color: #090A75; font: 600 15px system-ui, sans-serif;
    box-shadow: 0 6px 0 #0224B8;
  }
  button:active { transform: translateY(3px); box-shadow: 0 3px 0 #0224B8; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #FF9A3C; margin-right: 8px; vertical-align: middle; }
</style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="PVNE Cards">
    <h1><span class="dot"></span>Você está sem internet</h1>
    <p>Lances, propostas e pedidos precisam de conexão para ficarem seguros. Assim que a internet voltar, o app recarrega sozinho.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
